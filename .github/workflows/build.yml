name: Build Grand Strategy Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Download and Install Gradle 6.8.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-6.8.3-bin.zip
          unzip -q gradle-6.8.3-bin.zip
          echo "$PWD/gradle-6.8.3/bin" >> $GITHUB_PATH

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: grandstrategy-forge-1.16.5
          path: build/libs/*.jar
