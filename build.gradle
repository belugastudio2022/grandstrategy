buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '4.1+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.0.0'
group = 'com.example.grandstrategy'
archivesBaseName = 'grandstrategy'

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    // MCP snapshot mappings are selected because this code intentionally uses
    // the 1.16.5 names TranslationTextComponent, KeyBinding and MatrixStack.
    mappings channel: 'snapshot', version: '20210309-1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                grandstrategy {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                grandstrategy {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'grandstrategy',
            'Specification-Vendor'    : 'example',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'example'
        ])
    }
    jar.finalizedBy('reobfJar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching(['META-INF/mods.toml']) {
        expand 'file': [jarVersion: project.version]
    }
}
